<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table & Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <a href="index.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="exercise1/index.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </nav>

    <div id="main">

        <!-- TABLE -->
        <h1 id="table-title">CS2 Tournament Results</h1>

        <table>
            <tr>
                <th>Player</th>
                <th>Map</th>
                <th>Kills</th>
                <th>Result</th>
            </tr>
            <tr>
                <td rowspan="2">s1mple</td>
                <td>Mirage</td>
                <td>32</td>
                <td>Win</td>
            </tr>
            <tr>
                <td>Dust 2</td>
                <td>28</td>
                <td>Win</td>
            </tr>
            <tr class="highlight-row">
                <td>NiKo</td>
                <td>Inferno</td>
                <td>35</td>
                <td>MVP</td>
            </tr>
            <tr>
                <td>donk</td>
                <td>Anubis</td>
                <td>21</td>
                <td>Loss</td>
            </tr>
            <tr>
                <td colspan="2">Total kills</td>
                <td colspan="2">116</td>
            </tr>
        </table>

        <h1>Tournament Registration</h1>

        <div class="form-box">
            <form>

                <label>Nickname:</label>
                <input type="text" placeholder="Your in-game name">

                <label>Email:</label>
                <input type="email" placeholder="your@email.com">

                <label>Rank:</label>
                <select>
                    <option>Silver</option>
                    <option>Gold Nova</option>
                    <option>Master Guardian</option>
                    <option>Global Elite</option>
                    <option>наруто узумакиии</option>
                </select>

                <label>Do you have a team?</label>
                <div class="radio-group">
                    <input type="radio" name="team" value="yes"> Yes
                    <input type="radio" name="team" value="no"> No
                </div>

                <label>Additional info:</label>
                <textarea placeholder="Your experience, preferred role, etc."></textarea>

                <button type="submit" id="send-btn">Register</button>

            </form>
        </div>

    </div>

</body>
</html>
