<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table & Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <a href="index.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="exercise1/index.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </nav>

    <div id="main">

        <h1 id="table-title">Student Grades</h1>

        <table>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
            <tr>
                <td rowspan="2">Aslan</td>
                <td>Linear Algebra</td>
                <td>Retake</td>
            </tr>
            <tr>
                <td>Introduction to Programming 1</td>
                <td>B-</td>
            </tr>
            <tr class="highlight-row">
                <td>Maria</td>
                <td>Linear Algebra</td>
                <td>A</td>
            </tr>
            <tr>
                <td>John</td>
                <td colspan="2">Not enrolled</td>
            </tr>
        </table>

        <h1>Feedback Form</h1>

        <div class="form-box">
            <form>

                <label>Name:</label>
                <input type="text" placeholder="Your name">

                <label>Email:</label>
                <input type="email" placeholder="Your email">

                <label>Role:</label>
                <select>
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>наруто узумакиии</option>
                    <option>Other</option>
                </select>

                <label>Would you recommend this course?</label>
                <div class="radio-group">
                    <input type="radio" name="recommend" value="yes"> Yes
                    <input type="radio" name="recommend" value="no"> No
                </div>

                <label>Comments:</label>
                <textarea placeholder="Write something..."></textarea>

                <button type="submit" id="send-btn">Submit</button>

            </form>
        </div>

    </div>

</body>
</html>
